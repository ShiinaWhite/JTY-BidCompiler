[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jty-bidcompiler"
version = "0.1.0"
description = "投标编译器 PoC：招标文件 → 可审第一稿"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = []

[project.scripts]
jty = "jty_bidcompiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jty_bidcompiler = ["../../schemas/*.json", "../../rules/*.json", "../../config/*.json"]
